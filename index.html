<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F8F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dove Sta">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dove Sta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;500;600;700&display=swap">
<style>
/* Concept: tavolo da disegno. Carta bianca, inchiostro scuro, blu di progetto.
   La mappa occupa tutto lo schermo, i comandi stanno in basso sotto il pollice. */
:root{
  color-scheme:light;
  --bg:#F6F8F8; --surface:#FFFFFF; --ink:#1E2B30; --muted:#5F6E74; --line:#DDE3E3;
  --grid:#E9EEEE; --grid-major:#D6DDDD; --room:#FFFFFF; --wall:#2B3A40;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --danger:#B3402E; --danger-ink:#FFFFFF;
  --c1:#E3C9A0; --c2:#BBD5E6; --c3:#C4D9C1; --c4:#EBCF7E; --c5:#E3AE9B; --c6:#D3D8DC;
  --lv-lo:#2E7D4F; --lv-mid:#B7791F; --lv-hi:#B3402E;
  --f-display:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Nunito',system-ui,sans-serif;
}
:root{box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
.phin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{height:100%;display:flex;flex-direction:column;position:relative;min-height:0}
.band{padding-block:8px}
header.band{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px}
h1{margin:0;display:flex;align-items:center;gap:8px;font:600 21px/1 var(--f-display);letter-spacing:-.01em}
.mark{flex:none}
.roomsel{display:flex;align-items:center;gap:8px;min-width:0}
select{min-height:38px;max-width:34vw;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.iconbtn{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer}

#toolbar{background:var(--surface);border-bottom:1px solid var(--line)}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.demo span{min-width:0}
.sbox{position:relative}
.sbox .si{position:absolute;left:12px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.sbox input{width:100%;min-height:40px;padding:0 40px 0 38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.qc{position:absolute;right:2px;top:50%;width:36px;height:36px;margin-top:-18px;border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer}
#results{max-height:30vh;overflow:auto;padding-bottom:8px}
.res{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.res li+li{border-top:1px solid var(--line)}
.res button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 12px;border:0;background:transparent;text-align:left;cursor:pointer}
.res b{font-weight:600}
.res span{font-size:13px;color:var(--muted)}
.modes{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{min-height:38px;padding:0 18px;border:0;background:transparent;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
#areaTxt{font:400 12px var(--f-mono);color:var(--muted);text-align:right}

#mapwrap{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
#map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.gl{stroke:var(--grid);stroke-width:1;fill:none}
.gM{stroke:var(--grid-major);stroke-width:1;fill:none}
.room{fill:var(--room);stroke:var(--wall);stroke-linejoin:miter}
.roomline{fill:none;stroke:var(--wall);stroke-linejoin:miter;stroke-linecap:square}
.fb{stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.furn{cursor:grab}
.furn text,.furn use{pointer-events:none}
.furn .ic{color:var(--ink)}
.furn.sel .fb,.furn.hit .fb{stroke:var(--accent);stroke-width:3}
.halo{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.furn.dim{opacity:.3}
.lvT{fill:var(--ink);opacity:.2}
.lvL,.lvM,.lvH{stroke:var(--surface);stroke-width:1}
.lvL{fill:var(--lv-lo)}
.lvM{fill:var(--lv-mid)}
.lvH{fill:var(--lv-hi)}
.cnt circle{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}
.cnt text{font:600 10px var(--f-mono);fill:var(--accent-ink);text-anchor:middle;dominant-baseline:central}
.lvl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lvl button{min-height:40px;padding:0 2px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:12px;font-weight:600;cursor:pointer}
.lvl button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.sbody h3 span{font-family:var(--f-mono);letter-spacing:0}
.furn.lock{pointer-events:none;opacity:.55}
.lbl{font:600 11px var(--f-body);fill:var(--ink);text-anchor:middle}
.lbl.out{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.dl{font:500 11px var(--f-mono);fill:var(--muted);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:4px;pointer-events:none}
.wl rect{fill:var(--surface);stroke:var(--accent);stroke-width:1}
.wl text{font:500 11px var(--f-mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.wl{cursor:pointer}
.vd{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.vd.first{fill:var(--bg);stroke:var(--accent);stroke-width:3}
.vx{cursor:move}
.rh{cursor:nwse-resize}
.rd{fill:var(--bg);stroke:var(--accent);stroke-width:3}
.tz{fill:none;stroke:var(--wall);stroke-linecap:square}
.tz.sel{stroke:var(--accent)}
.tzh{fill:none;stroke:transparent;stroke-linecap:round;cursor:pointer}
.guide{stroke:var(--accent);stroke-width:1;stroke-dasharray:6 5;opacity:.75;pointer-events:none}
.ra{fill:none;stroke:var(--accent);stroke-width:1.5;pointer-events:none}
.rl{font:600 11px var(--f-body);fill:var(--muted);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--room);stroke-width:3px;stroke-linejoin:round}
.rs{font:500 10px var(--f-mono);fill:var(--muted);text-anchor:middle;pointer-events:none}

.undo{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px}
.zb:disabled{opacity:.4;cursor:default}
.ptx{cursor:grab}
.ptx rect{fill:transparent;stroke:none}
.ptx text{font-family:var(--f-body);font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.ptx.sel rect{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.ptx.lock{pointer-events:none;opacity:.55}
.zoom{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.zb{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer}
.scale{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:10px;display:flex;flex-direction:column;gap:3px;font:500 11px var(--f-mono);color:var(--muted);pointer-events:none}
#scaleBar{height:7px;border:1.5px solid var(--ink);border-top:0}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.card{pointer-events:auto;max-width:330px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{margin:0 0 6px;font:600 19px var(--f-display)}
.card p{margin:0 0 14px;color:var(--muted)}

#dock{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line)}
#dock.open{flex:0 0 52%;min-height:0;display:flex;flex-direction:column}
#dock.open.min{flex:0 0 auto}
#dock.min .sbody{display:none}
.dockin{padding-block:10px 12px}
.hint{margin:0 0 8px;font-size:13px;color:var(--muted)}
.pal{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pitem{flex:0 0 auto;width:84px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:12px;font-weight:500;cursor:pointer}
.pitem svg{color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;font-size:14px;cursor:pointer}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;flex:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:var(--danger-ink);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}

.shead{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.shead svg{flex:none;color:var(--accent)}
.nameIn{flex:1;min-width:0;padding:6px 0;border:0;border-bottom:1px dashed var(--line);background:transparent;font:600 19px var(--f-display);color:var(--ink)}
.sbody{flex:1;min-height:0;overflow:auto;padding-bottom:18px}
.sbody h3{margin:14px 0 8px;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-style:dashed;color:var(--accent);font-size:12px;font-weight:600;text-align:center}
.list{list-style:none;margin:0 0 8px;padding:0}
.list li{display:block;padding:6px 0;border-bottom:1px solid var(--line)}
.irow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iname{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:4px 0;border:0;background:transparent;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.itx{font-weight:500}
.bds{display:flex;flex-wrap:wrap;gap:4px}
.bd{font:600 11px var(--f-body);font-style:normal;padding:2px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.bd.st-tieni{color:var(--accent);border-color:var(--accent)}
.bd.st-buttare,.bd.warn{color:var(--danger);border-color:var(--danger)}
.bd.st-regalare{color:var(--lv-lo);border-color:var(--lv-lo)}
.bd.st-vendere{color:var(--lv-mid);border-color:var(--lv-mid)}
.bd.out{color:var(--ink)}
.idet{margin:8px 0 6px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.idet .inp,.idet select{background:var(--surface)}
.kids{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.sbody select{width:100%;max-width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.mlist{display:flex;flex-direction:column;gap:8px}
input[type=range]{width:100%;min-height:32px}
.op.lock{pointer-events:none}
.opw{fill:var(--room);stroke:none}
.op.sel .opw{stroke:var(--accent);stroke-width:2}
.opl{stroke:var(--wall);stroke-width:2;fill:none}
.opl.thin{stroke-width:1.5}
.opa{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;fill:none}
.oph{fill:transparent}
.op{cursor:grab}
.room.hasbg{fill:transparent}
.bgi{cursor:grab}
.emo{text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.pemo{font-size:26px;line-height:30px;height:30px}
.emoh{flex:none;font-size:26px;line-height:30px;width:30px;text-align:center}
.th{margin:12px 0 4px;font:600 16px var(--f-display)}
.tk{margin:8px 0 2px;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.tl small{color:var(--muted)}
.seg.full{display:flex;width:100%;margin-bottom:8px}
.seg.full button{flex:1;padding:0 6px;font-size:14px}
.lbl{pointer-events:none}
.legend{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;pointer-events:none;font:500 11px var(--f-body)}
.legend span{display:flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.legend i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line)}
.ico-mono .emo,.ico-mono .pemo,.ico-mono .emoh,.ico-line .emo,.ico-line .pemo,.ico-line .emoh{filter:grayscale(1)}
#areaTxt{border:0;background:transparent;padding:6px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.dlg.wide{width:min(100%,520px)}
.lrow{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.lrow .le{flex:none;width:30px;text-align:center;font-size:22px}
.lrow .lt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.lrow small{display:block;font-weight:400;color:var(--muted)}
.lrow .ln{flex:none;font:500 12px var(--f-mono);color:var(--muted);text-align:right}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ocard{padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.ocard svg{width:100%;height:auto;display:block;background:var(--surface);border-radius:6px}
.ocard small{color:var(--muted);font-size:12px}
.msbar{display:flex;flex-direction:column;gap:8px;padding:10px;margin-bottom:8px;border:1px solid var(--accent);border-radius:10px;background:var(--bg)}
.msbar select{min-height:40px}
.ckb{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:6px;background:var(--surface);display:grid;place-items:center;color:var(--accent-ink);font-size:14px;line-height:1}
.ckb.on{background:var(--accent);border-color:var(--accent)}
.snr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.hi{background:var(--danger)}
body.th-mare{--bg:#F6F3EC;--ink:#1F2D3A;--menu:#1F4E79}
body.th-mare[data-sec=furn]{--accent:#0E7C86;--tint:#DFF0F1}
body.th-mare[data-sec=room]{--accent:#D2692A;--tint:#FBE9DA}
body.th-bosco{--bg:#F2F5EF;--ink:#1F2D24;--menu:#2E6B6B}
body.th-bosco[data-sec=furn]{--accent:#2E7D4F;--tint:#DDEEE3}
body.th-bosco[data-sec=room]{--accent:#A5651F;--tint:#F4E8D6}
body.th-frutta{--bg:#F7F7FB;--ink:#1F2340;--menu:#F08A00}
body.th-frutta[data-sec=furn]{--accent:#3D5AFE;--tint:#E4E8FF}
body.th-frutta[data-sec=room]{--accent:#E0447C;--tint:#FFE3EC}
body.th-viola{--bg:#F8F6FB;--ink:#271F3A;--menu:#6A46C9}
body.th-viola[data-sec=furn]{--accent:#6A46C9;--tint:#EAE3FA}
body.th-viola[data-sec=room]{--accent:#E4572E;--tint:#FDE5DD}
body[class*=th-] header.band,body[class*=th-] #toolbar,body[class*=th-] .demo{background:var(--tint)}
body[class*=th-] .mh,body[class*=th-] .dlg h2{color:var(--menu)}
body[class*=th-] .seg{background:#fff}
.wzbar{position:absolute;z-index:9;top:8px;left:8px;right:56px;display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.14)}.wzbar .wzn{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}.wzbar .wzh{font-size:13px;color:var(--muted)}.wzbar .wzb{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.wzbar .btn{min-height:36px;padding:0 12px}
.csvl{margin:0 0 8px;padding-left:18px}.csvl li{margin:3px 0}
.thl{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.thl button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer;text-align:left}.thl button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.thl i{display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}.thl span{display:flex;gap:4px;margin-left:auto}
.mh{margin:10px 0 2px;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cap{display:block;margin:-6px 0 10px;font-size:13px;color:var(--muted)}
.gdots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.gdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.gdots i.on{background:var(--accent)}
.gbig{font-size:44px;line-height:1;margin:2px 0 6px}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.chk input{width:20px;height:20px}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:30vh;overflow:auto;margin-bottom:4px}
.egrid button{aspect-ratio:1;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:22px;line-height:1;cursor:pointer}
.egrid button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.dlg{max-height:92%;overflow:auto}
.hg details{border-bottom:1px solid var(--line)}
.hg summary{min-height:46px;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.hg .hb{padding:0 2px 10px;font-size:14.5px;line-height:1.5}
.hg .hb p{margin:0 0 8px}
.hg .hb ul,.hg .hb ol{margin:0 0 8px;padding-left:20px}
.hg .hb li{margin-bottom:5px}
#print{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #app{display:none!important}
  #print{display:block}
  .qrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}

/* Muri (perimetro e tramezze) come segmenti, per allineare mobili e porte. */
function wallSegs(r){
  const s=[],P=r.pts,n=P.length,m=r.closed&&n>=3?n:n-1;
  for(let i=0;i<m;i++) s.push({a:P[i],b:P[(i+1)%n]});

}
function alignSnap(r,f,nx,ny){
  const e=ext(f),th=9/ui.view.ppm,tx=[],ty=[];
  r.furn.forEach(o=>{
    if(o.id===f.id||o.par) return;
    const q=ext(o);
    tx.push({v:o.x-q.hw},{v:o.x},{v:o.x+q.hw});ty.push({v:o.y-q.hh},{v:o.y},{v:o.y+q.hh});
  });
  wallSegs(r).forEach(sg=>{
    if(Math.abs(sg.a.x-sg.b.x)<1e-4){const t=sg.a.x;tx.push({v:t+0.05,m:'l'},{v:t-0.05,m:'r'});}
    if(Math.abs(sg.a.y-sg.b.y)<1e-4){const t=sg.a.y;ty.push({v:t+0.05,m:'l'},{v:t-0.05,m:'r'});}
  });
  const pick=(c,h,T)=>{
    let best=null;
    const ms=[{v:c-h,m:'l'},{v:c,m:'c'},{v:c+h,m:'r'}];
    T.forEach(t=>ms.forEach(m=>{
      if(t.m&&t.m!==m.m) return;
      const d=t.v-m.v;
      if(Math.abs(d)<=th&&(!best||Math.abs(d)<Math.abs(best.d))) best={d,at:t.v};
    }));
    return best;
  };
  const bx=pick(nx,e.hw,tx),by=pick(ny,e.hh,ty),g=[];
  if(bx){nx+=bx.d;g.push({q:{x:bx.at,y:ny},d:[0,1]});}
  if(by){ny+=by.d;g.push({q:{x:nx,y:by.at},d:[1,0]});}
  return {x:nx,y:ny,g};
}
/* Le porte e le finestre restano attaccate al loro muro quando il muro viene spostato o allungato. */
function attachOps(r){
  const segs=wallSegs(r),out=[];
  r.ops.forEach(o=>{
    let best=null;
    segs.forEach(sg=>{
      const dx=sg.b.x-sg.a.x,dy=sg.b.y-sg.a.y,l2=dx*dx+dy*dy;
      if(l2<1e-8) return;
      const t=clamp(((o.x-sg.a.x)*dx+(o.y-sg.a.y)*dy)/l2,0,1),d=Math.hypot(o.x-(sg.a.x+dx*t),o.y-(sg.a.y+dy*t));
      if(!best||d<best.d) best={d,a:sg.a,b:sg.b,t};
    });
    if(best&&best.d<0.25) out.push({o,a:best.a,b:best.b,t:best.t});
  });
  return out;
}
function followOps(att){
  att.forEach(k=>{
    const dx=k.b.x-k.a.x,dy=k.b.y-k.a.y;
    if(Math.hypot(dx,dy)<1e-6) return;
    k.o.x=rnd(k.a.x+dx*k.t);k.o.y=rnd(k.a.y+dy*k.t);
    k.o.a=rnd((((Math.atan2(dy,dx)*180/Math.PI)%180)+180)%180);
  });
}
function nearWall(r,p){
  let best=null;
  wallSegs(r).forEach(sg=>{
    const dx=sg.b.x-sg.a.x,dy=sg.b.y-sg.a.y,l2=dx*dx+dy*dy;
    if(l2<1e-8) return;
    const t=clamp(((p.x-sg.a.x)*dx+(p.y-sg.a.y)*dy)/l2,0,1);
    const x=sg.a.x+dx*t,y=sg.a.y+dy*t,d=Math.hypot(p.x-x,p.y-y);
    if(!best||d<best.d) best={d,x,y,a:(((Math.atan2(dy,dx)*180/Math.PI)%180)+180)%180};
  });
  return best;
}

  r.furn.forEach(f=>{if(f.par) return;const e=ext(f);pts.push({x:f.x-e.hw,y:f.y-e.hh},{x:f.x+e.hw,y:f.y+e.hh});});
  (r.texts||[]).forEach(t=>pts.push({x:t.x,y:t.y}));
  if(!pts.length&&r.bg&&r.bg.img){
    const bw=r.bg.w0*r.bg.s/100,bh=bw/r.bg.ar,q=((r.bg.rot||0)%180)!==0,hw=(q?bh:bw)/2,hh=(q?bw:bh)/2;
    pts.push({x:r.bg.x-hw,y:r.bg.y-hh},{x:r.bg.x+hw,y:r.bg.y+hh});
  }
  if(!pts.length) return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

function gridSvg(b,ppm){
  let s=ppm>=40?0.5:ppm>=14?1:5;
  while(((b.x1-b.x0)/s+(b.y1-b.y0)/s)>260) s*=5;
  const M=s<=0.5?1:s<=1?5:s*5;

  const lines=(a0,a1,vert)=>{
    for(let t=Math.ceil(a0/s)*s;t<=a1;t+=s){
      const isM=Math.abs(t/M-Math.round(t/M))<1e-6;
      const p1=vert?w2s(t,b.y0):w2s(b.x0,t),p2=vert?w2s(t,b.y1):w2s(b.x1,t);
      const d=`M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
      if(isM) major+=d; else minor+=d;
    }
  };
  lines(b.x0,b.x1,true);lines(b.y0,b.y1,false);

/* Raggruppa i tratti consecutivi del perimetro che stanno sulla stessa retta: una sola misura, la somma. */
function perimRuns(pts,closed){
  const n=pts.length,m=closed&&n>=3?n:n-1;
  if(m<1) return [];
  const D=[];
  for(let i=0;i<m;i++){
    const a=pts[i],c=pts[(i+1)%n],dx=c.x-a.x,dy=c.y-a.y;
    D.push({dx,dy,l:Math.hypot(dx,dy)});
  }
  const cont=i=>{
    if(D[i].l<1e-3) return closed||i>0;
    let j=i-1;
    if(closed) j=(i-1+m)%m;
    let guard=0;
    while(j>=0&&D[j].l<1e-3&&guard++<m) j=closed?(j-1+m)%m:j-1;
    if(j<0||guard>m) return false;
    const p=D[j],q=D[i];
    const cr=(p.dx*q.dy-p.dy*q.dx)/(p.l*q.l),dt=(p.dx*q.dx+p.dy*q.dy)/(p.l*q.l);
    return dt>0&&Math.abs(cr)<0.003;
  };
  let start=0;
  if(closed){
    start=-1;
    for(let i=0;i<m;i++) if(!cont(i)){start=i;break;}
    if(start<0) return [];
  }
  const runs=[];
  let cur=null;
  for(let k=0;k<m;k++){
    const i=(start+k)%m;
    if(!cur||!cont(i)){cur={i,c:0,len:0};runs.push(cur);}
    cur.c++;cur.len+=D[i].l;
  }
  return runs;
}

/* Toglie i punti inutili del perimetro: duplicati e punti che stanno già su una retta. */
function mergeCollinear(r,only){
  const P=r.pts;
  let ch=false,again=true;
  while(again){
    again=false;
    const n=P.length;
    if(r.closed?n<=3:n<=2) break;
    const lo=r.closed?0:1,hi=r.closed?n:n-1;
    for(let i=lo;i<hi;i++){
      const a=P[(i-1+n)%n],b=P[i],c=P[(i+1)%n];
      if(b.k||(only&&!only.has(b))) continue;
      const ux=b.x-a.x,uy=b.y-a.y,vx=c.x-b.x,vy=c.y-b.y,l1=Math.hypot(ux,uy),l2=Math.hypot(vx,vy);
      let rm=l1<1e-3||l2<1e-3;
      if(!rm){
        const cr=(ux*vy-uy*vx)/(l1*l2),dt=(ux*vx+uy*vy)/(l1*l2);
        rm=dt>0&&Math.abs(cr)<0.003;
      }
      if(rm){P.splice(i,1);ch=true;again=true;break;}
    }
  }
  return ch;
}

function startPinch(){
  const [a,b]=[...ptrs.values()];
  pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,ppm0:ui.view.ppm,anchor:toWorld((a.x+b.x)/2,(a.y+b.y)/2),
    ang:Math.atan2(b.y-a.y,b.x-a.x),cum:0,step:0,rot0:ui.view.rot,t0:performance.now(),moved:false,
    sa:{x:a.x,y:a.y},sb:{x:b.x,y:b.y}};
}
function doPinch(){
  const [a,b]=[...ptrs.values()];
  const d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const v=ui.view,r=svg.getBoundingClientRect();
  if(Math.hypot(a.x-pinch.sa.x,a.y-pinch.sa.y)>14||Math.hypot(b.x-pinch.sb.x,b.y-pinch.sb.y)>14) pinch.moved=true;
  const an=Math.atan2(b.y-a.y,b.x-a.x);
  let da=an-pinch.ang;
  while(da>Math.PI) da-=2*Math.PI;
  while(da<-Math.PI) da+=2*Math.PI;
  pinch.cum+=da*180/Math.PI;pinch.ang=an;
  /* La vista scatta di 90 gradi quando la rotazione supera 55 gradi oltre l'ultimo scatto. */
  while(pinch.cum-pinch.step*90>55) pinch.step++;
  while(pinch.cum-pinch.step*90<-55) pinch.step--;
  v.rot=(((pinch.rot0+pinch.step*90)%360)+360)%360;
  v.ppm=clamp(pinch.ppm0*d/pinch.d0,8,220);
  const dd=s2w(mx-r.left-r.width/2,my-r.top-r.height/2);
  v.cx=pinch.anchor.x-dd.x;
  v.cy=pinch.anchor.y-dd.y;
  render();
}

svg.addEventListener('pointermove',e=>{

    const w=toWorld(e.clientX,e.clientY),l=drag.pts[drag.pts.length-1];

  }else if(drag.k==='ptxt'){
    const tx=getT(drag.id);

  }else if(drag.k==='wend'){
    const wl=R().walls.find(x=>x.id===drag.id),pt=wl[drag.e],ot=wl[drag.e==='a'?'b':'a'];

    pt.x=s.x;pt.y=s.y;
    (drag.link||[]).forEach(l=>{l.x=s.x;l.y=s.y;});
    followOps(drag.att||[]);
    rq();
  }else if(drag.k==='vtx'){
    const p=R().pts[drag.i];

function snapToLines(raw,specs){
  const th=14/ui.view.ppm,lines=[];
  specs.forEach(sp=>{
    let best=null;
    sp.dirs.forEach(d=>{
      const t=(raw.x-sp.q.x)*d[0]+(raw.y-sp.q.y)*d[1];
      const dist=Math.hypot(sp.q.x+t*d[0]-raw.x,sp.q.y+t*d[1]-raw.y);
      if(dist<th&&(!best||dist<best.dist)) best={q:sp.q,d,dist};
    });
    if(best) lines.push(best);
  });
  if(!lines.length) return {x:snap(raw.x),y:snap(raw.y),lines:null};
  const rnd=v=>Math.round(v*1e4)/1e4;
  const proj=L=>{
    const d=L.d,q=L.q;
    if(d[1]===0&&d[0]!==0) return {x:snap(raw.x),y:q.y};
    if(d[0]===0&&d[1]!==0) return {x:q.x,y:snap(raw.y)};
    const t=(raw.x-q.x)*d[0]+(raw.y-q.y)*d[1];
    return {x:rnd(q.x+t*d[0]),y:rnd(q.y+t*d[1])};
  };
  if(lines.length>=2){
    const a=lines[0],b=lines[1],cr=a.d[0]*b.d[1]-a.d[1]*b.d[0];
    if(Math.abs(cr)>1e-6){
      const wx=b.q.x-a.q.x,wy=b.q.y-a.q.y,t=(wx*b.d[1]-wy*b.d[0])/cr;
      const p={x:rnd(a.q.x+t*a.d[0]),y:rnd(a.q.y+t*a.d[1])};
      if(Math.hypot(p.x-raw.x,p.y-raw.y)<th*3) return {x:p.x,y:p.y,lines:[a,b]};
    }
    const near=a.dist<=b.dist?a:b,p=proj(near);
    return {x:p.x,y:p.y,lines:[near]};
  }
  const p=proj(lines[0]);
  return {x:p.x,y:p.y,lines:[lines[0]]};
}
function snapVertex(i,raw){
  const pts=R().pts,n=pts.length,closed=R().closed,specs=[];
  const nbr=(k,dir)=>{const j=k+dir;if(j>=0&&j<n) return pts[j];return closed?pts[(j+n)%n]:null;};
  [-1,1].forEach(dir=>{
    const q=nbr(i,dir);
    if(!q||q===pts[i]) return;
    const qi=pts.indexOf(q),q2=nbr(qi,dir),dirs=[[1,0],[0,1]];
    if(q2&&q2!==pts[i]&&q2!==q){
      const dx=q.x-q2.x,dy=q.y-q2.y,l=Math.hypot(dx,dy);
      if(l>1e-6) dirs.push([dx/l,dy/l],[-dy/l,dx/l]);
    }
    specs.push({q,dirs});
  });
  return snapToLines(raw,specs);
}
function snapDraw(raw){
  const pts=R().pts,n=pts.length,specs=[];
  if(n>=1){
    const q=pts[n-1],dirs=[[1,0],[0,1]];
    if(n>=2){
      const a=pts[n-2],dx=q.x-a.x,dy=q.y-a.y,l=Math.hypot(dx,dy);
      if(l>1e-6) dirs.push([dx/l,dy/l],[-dy/l,dx/l]);
    }
    specs.push({q,dirs});
  }
  if(n>=2) specs.push({q:pts[0],dirs:[[1,0],[0,1]]});
  return snapToLines(raw,specs);
}
function rAng(P,i,closed){
  const n=P.length;
  if(n<3) return '';
  const hp=(i>0||closed)?P[(i-1+n)%n]:null,nx=(i<n-1||closed)?P[(i+1)%n]:null;
  if(!hp||!nx) return '';
  const p=P[i];
  let ux=hp[0]-p[0],uy=hp[1]-p[1],vx=nx[0]-p[0],vy=nx[1]-p[1];
  const lu=Math.hypot(ux,uy),lv=Math.hypot(vx,vy);
  if(lu<24||lv<24) return '';
  ux/=lu;uy/=lu;vx/=lv;vy/=lv;
  if(Math.abs(ux*vx+uy*vy)>0.003) return '';
  const s=11;
  return `<path class="ra" d="M${(p[0]+ux*s).toFixed(1)} ${(p[1]+uy*s).toFixed(1)}L${(p[0]+(ux+vx)*s).toFixed(1)} ${(p[1]+(uy+vy)*s).toFixed(1)}L${(p[0]+vx*s).toFixed(1)} ${(p[1]+vy*s).toFixed(1)}"/>`;
}
function snapPoint(w,ref,skip){
  const r=R(),th=14/ui.view.ppm,n=r.pts.length,sk=Array.isArray(skip)?skip:[skip];
  let best=null,bd=th;
  const nodes=r.pts.slice();
  r.walls.forEach(x=>{nodes.push(x.a,x.b);});
  nodes.forEach(p=>{
    if(sk.includes(p)||p===ref) return;
    const d=Math.hypot(p.x-w.x,p.y-w.y);
    if(d<bd){bd=d;best={x:p.x,y:p.y};}
  });
  if(best) return best;
  const segs=[];
  if(r.closed&&n>=3) for(let i=0;i<n;i++) segs.push([r.pts[i],r.pts[(i+1)%n]]);
  r.walls.forEach(x=>{if(!sk.includes(x.a)&&!sk.includes(x.b)) segs.push([x.a,x.b]);});
  let ob=null,obd=th*2;
  segs.forEach(s=>{
    const a=s[0],b=s[1],dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
    if(!l2) return;
    const t=clamp(((w.x-a.x)*dx+(w.y-a.y)*dy)/l2,0,1);
    const px=a.x+t*dx,py=a.y+t*dy,d=Math.hypot(px-w.x,py-w.y);
    if(d<bd){bd=d;best={x:px,y:py};}
    if(ref){
      if(Math.abs(w.y-ref.y)<th*2&&Math.abs(dy)>1e-9){
        const t2=(ref.y-a.y)/dy;
        if(t2>=0&&t2<=1){const ix=a.x+t2*dx,d2=Math.hypot(ix-w.x,ref.y-w.y);if(d2<obd){obd=d2;ob={x:ix,y:ref.y};}}
      }
      if(Math.abs(w.x-ref.x)<th*2&&Math.abs(dx)>1e-9){
        const t3=(ref.x-a.x)/dx;
        if(t3>=0&&t3<=1){const iy=a.y+t3*dy,d3=Math.hypot(ref.x-w.x,iy-w.y);if(d3<obd){obd=d3;ob={x:ref.x,y:iy};}}
      }
    }
  });
  if(ob) return ob;
  if(best) return best;
  let x=snap(w.x),y=snap(w.y);
  if(ref){if(Math.abs(w.x-ref.x)<th) x=ref.x;if(Math.abs(w.y-ref.y)<th) y=ref.y;}
  return {x,y};
}
function wallTap(d){
  const r=R(),wd=ui.wallDraw;
  if(d.k==='wall') return;

function editTz(){
  const r=R(),w=r.walls.find(x=>x.id===ui.selWall);
  if(!w) return;

    const L=parseNum(v[0]);
    if(!(L>=0.1&&L<=50)) return 'Scrivi una lunghezza tra 0,1 e 50 metri, ad esempio 2,40.';
    const dx=(w.b.x-w.a.x)/(len||1),dy=(w.b.y-w.a.y)/(len||1);

/* Doppio tocco su un muro o una tramezza: aggiunge un punto che si può trascinare. */
let lastTap=null;
function addPointAt(w){
  const r=R(),n=r.pts.length,ppm=ui.view.ppm,th=16/ppm;
  const nodes=r.pts.slice();
  r.walls.forEach(x=>{nodes.push(x.a,x.b);});
  if(nodes.some(p=>Math.hypot(p.x-w.x,p.y-w.y)<22/ppm)) return false;
  const near=(a,b)=>{
    const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
    if(l2<1e-8) return null;
    const t=clamp(((w.x-a.x)*dx+(w.y-a.y)*dy)/l2,0,1),px=a.x+t*dx,py=a.y+t*dy;
    return {x:px,y:py,d:Math.hypot(px-w.x,py-w.y)};
  };
  let best=null;
  if(n>=3) for(let i=0;i<n;i++){
    const q=near(r.pts[i],r.pts[(i+1)%n]);
    if(q&&q.d<th&&(!best||q.d<best.d)) best={kind:'p',i,x:q.x,y:q.y,d:q.d};
  }
  r.walls.forEach(wl=>{
    const q=near(wl.a,wl.b);
    if(q&&q.d<th&&(!best||q.d<best.d)) best={kind:'w',wl,x:q.x,y:q.y,d:q.d};
  });
  if(!best) return false;
  const rnd=v=>Math.round(v*1e4)/1e4,x=rnd(best.x),y=rnd(best.y);
  if(best.kind==='p') r.pts.splice(best.i+1,0,{x,y,k:1});
  else{
    const wl=best.wl,nw={id:uid(),a:{x,y},b:{x:wl.b.x,y:wl.b.y}};
    wl.b={x,y};r.walls.push(nw);
  }
  ui.selWall=null;
  save();render();renderInfo();renderDock();
  toast('Punto aggiunto: trascinalo per piegare la linea.');
  return true;
}
function tap(d){
  if(ui.wz&&ui.mode==='furn'){if(d.k==='bg') wzAt(d.w);return;}
  if(ui.cal&&ui.mode==='room'){calTap(d);return;}
  if(ui.free&&ui.mode==='room') return;
  if(ui.zone&&ui.mode==='room'){zoneTap(d);return;}
  if(d.k==='bgi') return;
  const r=R(),now=performance.now();
  const dbl=lastTap&&now-lastTap.t<400&&Math.hypot(d.sx-lastTap.x,d.sy-lastTap.y)<30;
  lastTap=dbl?null:{t:now,x:d.sx,y:d.sy};
  if(dbl&&ui.mode==='room'&&r.closed&&!ui.wallDraw&&d.k!=='vtx'&&d.k!=='wend'&&d.k!=='wall'&&d.k!=='op'&&addPointAt(d.w)) return;
  if(ui.wallDraw&&ui.mode==='room'&&r.closed){wallTap(d);return;}
  if(d.k==='op'){ui.selOp=d.id;ui.selWall=null;render();renderDock();return;}
  if(d.k==='wseg'||d.k==='wend'){ui.selWall=d.id;ui.selOp=null;render();renderDock();return;}
  if(d.k==='furn'){if(ui.sel===d.id){ui.hdlOn=!ui.hdlOn;render();if(ui.hdlOn) toast('Trascina i puntini agli angoli per cambiare la misura.');return;}select(d.id);return;}
  if(d.k==='ptxt'){selectTxt(d.id);return;}
  if(d.k==='vtx'){
    if(!r.closed&&d.i===0&&r.pts.length>=3) closeRoom();
    return;
  }
  if(d.k==='wall'){editWall(d.i,d.c);return;}
  if(ui.mode==='room'&&!r.closed){
    const s=snapDraw(d.w),p={x:s.x,y:s.y},l=r.pts[r.pts.length-1];
    if(l&&Math.hypot(l.x-p.x,l.y-p.y)<0.04) return;
    r.pts.push(p);save();render();renderInfo();renderDock();
  }else if(ui.mode==='room'&&(ui.selWall||ui.selOp)){ui.selWall=null;ui.selOp=null;render();renderDock();}
  else if(ui.mode==='furn'&&(ui.sel||ui.selTxt)){select(null);}
}
function closeRoom(){
  const r=R();
  if(r.pts.length<3) return;
  r.closed=true;mergeCollinear(r);save();renderDock();render();renderInfo();
}
function editWall(i,cnt){
  cnt=cnt||1;
  const r=R(),n=r.pts.length,idx=[];
  for(let k=0;k<=cnt;k++) idx.push((i+k)%n);
  const a=r.pts[idx[0]],e=r.pts[idx[cnt]];
  let len=0;
  for(let k=0;k<cnt;k++){const p=r.pts[idx[k]],q=r.pts[idx[k+1]];len+=Math.hypot(q.x-p.x,q.y-p.y);}
  const de=Math.hypot(e.x-a.x,e.y-a.y);
  openModal({title:cnt>1?'Lunghezza del muro intero':'Lunghezza del muro',text:cnt>1?'Il muro è fatto di '+cnt+' tratti in linea: la misura è la somma. Cambiandola, i tratti si allungano o si accorciano insieme.':'',ok:'Applica',fields:[{label:'Lunghezza',value:fmt2(len),suffix:'m'}],onOk:v=>{
    const L=parseNum(v[0]);
    if(!(L>=0.1&&L<=50)) return 'Scrivi una lunghezza tra 0,1 e 50 metri, ad esempio 3,20.';
    if(de<1e-6) return 'Questo muro è troppo corto per essere cambiato.';
    const att=attachOps(r),sc=L/de,rnd=x=>Math.round(x*1e4)/1e4,ox=a.x,oy=a.y;
    for(let k=1;k<=cnt;k++){
      const p=r.pts[idx[k]],px=p.x-ox,py=p.y-oy;
      p.x=rnd(ox+px*sc);p.y=rnd(oy+py*sc);

  }});
}

/* Mano libera: da un tratto del dito a una stanza con muri dritti. */
function rdp(P,eps){
  const keep=new Array(P.length).fill(false);keep[0]=keep[P.length-1]=true;
  const st=[[0,P.length-1]];
  while(st.length){
    const [i,j]=st.pop();
    const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1e-9;
    let m=-1,md=0;
    for(let k=i+1;k<j;k++){
      const d=Math.abs((P[k].x-a.x)*dy-(P[k].y-a.y)*dx)/l;
      if(d>md){md=d;m=k;}
    }
    if(md>eps&&m>0){keep[m]=true;st.push([i,m],[m,j]);}
  }
  return P.filter((_,i)=>keep[i]);
}
function processFree(raw){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  raw.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);});
  const diag=Math.hypot(x1-x0,y1-y0);
  if(Math.max(x1-x0,y1-y0)<0.8){toast('Il disegno è troppo piccolo: fai un tratto più grande.');render();return;}
  const eps=clamp(diag*0.035,0.08,0.35);
  let s=rdp(raw,eps);
  const near=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  if(s.length>2&&near(s[s.length-1],s[0])<Math.max(eps*4,0.45)) s.pop();
  const minE=Math.max(0.2,diag*0.04);
  for(let g=0;g<20;g++){
    let ch=false;
    for(let i=0;i<s.length&&s.length>3;i++){
      const j=(i+1)%s.length;
      if(near(s[i],s[j])<minE){s[i]={x:(s[i].x+s[j].x)/2,y:(s[i].y+s[j].y)/2};s.splice(j,1);ch=true;break;}
    }
    if(!ch) break;
  }
  if(s.length<3){toast('Non riesco a capire la forma: riprova con un tratto più chiaro.');render();return;}
  const n=s.length,px=[...Array(n).keys()],py=[...Array(n).keys()];
  const fd=(u,i)=>{while(u[i]!==i){u[i]=u[u[i]];i=u[i];}return i;};
  const un=(u,i,j)=>{u[fd(u,i)]=fd(u,j);};
  for(let i=0;i<n;i++){
    const j=(i+1)%n,dx=s[j].x-s[i].x,dy=s[j].y-s[i].y;
    const t=Math.atan2(Math.abs(dy),Math.abs(dx))*180/Math.PI;
    if(t<20) un(py,i,j);else if(t>70) un(px,i,j);
  }
  const mean=(u,key)=>{const sm={},ct={};for(let i=0;i<n;i++){const g=fd(u,i);sm[g]=(sm[g]||0)+s[i][key];ct[g]=(ct[g]||0)+1;}return i=>sm[fd(u,i)]/ct[fd(u,i)];};
  const mx=mean(px,'x'),my=mean(py,'y');
  const q5=v=>Math.round(v*20)/20;
  let pts=s.map((_,i)=>({x:q5(mx(i)),y:q5(my(i))}));
  pts=pts.filter((q,i)=>near(q,pts[(i+1)%pts.length])>0.04);
  if(pts.length<3||Math.abs(sArea(pts))<0.5){toast('Non riesco a capire la forma: riprova con un tratto più chiaro.');render();return;}
  const r=R();
  r.pts=pts;r.closed=true;ui.free=false;
  mergeCollinear(r);
  save();fit();renderInfo();renderDock();
  toast('Ho ripulito il disegno: muri dritti e angoli a 90°. Controlla le misure e toccale per correggerle. Per rifare usa Annulla.');
}

function opPanelHtml(o){
  const pt=o.k==='porta';
  return `<div class="dockin pad"><p class="hint">${pt?'Porta':'Finestra'}: trascinala lungo i muri, cambia la larghezza${pt?' o il verso di apertura':''}.</p>
<label class="fld"><span>Larghezza</span><span class="inp"><input id="opW" inputmode="numeric" value="${Math.round(o.w*100)}"><em>cm</em></span></label>
<div class="tools">${pt?'<button type="button" class="btn" id="opFlip">Cambia apertura</button>':''}<button type="button" class="btn pri" id="opDone">Fatto</button><button type="button" class="btn danger" id="opDel">Elimina</button></div></div>`;
}
function renderDock(){
  const dock=$('#dock'),f=getF(ui.sel),tx=getT(ui.selTxt),op=ui.mode==='room'?getOp():null;
  $('#toolbar').hidden=!!f;
  if(f){
    const old=dock.querySelector('.sbody'),keep=old&&lastSel===f.id?old.scrollTop:0;
    dock.className=ui.shMin?'open min':'open';dock.innerHTML=sheetHtml(f);pend=null;renderPhotos(f);renderItems(f);renderPend();
    const nb=dock.querySelector('.sbody');if(nb&&keep) nb.scrollTop=keep;
    lastSel=f.id;
  }
  else if(tx){dock.className='';dock.innerHTML=textPanelHtml(tx);lastSel=null;}
  else if(ui.mode==='room'&&ui.cal){dock.className='';dock.innerHTML=calPanelHtml();lastSel=null;}
  else if(ui.mode==='room'&&ui.fin){dock.className='';dock.innerHTML=`<div class="dockin pad"><p class="hint"><b>Controlla il disegno.</b> I punti blu sono gli angoli: trascinali se qualcosa non torna. Quando va bene premi Ok: la piantina viene salvata e in Mobili vedrai solo i muri, senza la foto.</p><div class="tools"><button type="button" class="btn pri" data-act="finok">Ok, salva</button><button type="button" class="btn" data-act="finedit">Correggi ancora</button></div></div>`;lastSel=null;}
  else if(ui.mode==='room'&&ui.free){dock.className='';dock.innerHTML=`<div class="dockin pad"><p class="hint"><b>Mano libera.</b> Disegna col dito la forma della stanza con un solo tratto, tornando vicino al punto di partenza. Poi l’app la rende dritta, con angoli a 90°. Con due dita puoi ingrandire.</p><div class="tools"><button type="button" class="btn" data-act="freestop">Annulla</button></div></div>`;lastSel=null;}
  else if(ui.mode==='room'&&ui.zone){dock.className='';dock.innerHTML=zonePanelHtml();lastSel=null;}
  else if(ui.mode==='room'&&ui.rpEd){dock.className='';dock.innerHTML=rpPanelHtml();lastSel=null;}
  else if(ui.mode==='room'&&ui.bgEd){dock.className='';dock.innerHTML=bgPanelHtml();lastSel=null;}
  else if(op){dock.className='';dock.innerHTML=opPanelHtml(op);lastSel=null;}
  else if(ui.mode==='room'){dock.className='';dock.innerHTML=toolsHtml();lastSel=null;}
  else{dock.className='';dock.innerHTML=paletteHtml();lastSel=null;}
  $('#empty').hidden=!(R().pts.length===0&&ui.mode==='furn'&&!ui.sel);
  if(!$('#empty').hidden){const em=$('#emModes'),k=S.rooms.length>1?'1':'0';if(!em.firstChild||em.dataset.k!==k){em.innerHTML=modesHtml();em.dataset.k=k;}}
}
function shrink(file,max0){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const full=usedChars>3200000,max=Math.min(max0||900,full?640:9999),k=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*k),h=Math.round(img.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',full?0.6:0.72));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}

const dock=$('#dock');
dock.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b) return;
  const f=getF(ui.sel),r=R();
  if(b.dataset.phr){phraseView(f?f.id:null);return;}
  if(b.id==='phTog'){ui.phOpen=!ui.phOpen;if(f) renderPhotos(f);return;}
  if(b.dataset.info==='pal'){infoView('Come funziona',['Tocca un mobile nella barra per aggiungerlo alla mappa, poi trascinalo al suo posto.','Con «Personalizzato» crei un contenitore tuo, con l’icona che vuoi.','Il numero sul mobile conta gli oggetti elencati dentro. La barra sotto il mobile dice quanto è pieno.','Un tocco sul mobile apre la sua scheda. Due tocchi mostrano i puntini agli angoli per cambiare la misura.']);return;}
  if(b.dataset.tsz!==undefined){
    const tx=getT(ui.selTxt);
    if(tx){tx.z=+b.dataset.tsz;save();render();dock.querySelectorAll('[data-tsz]').forEach(x=>x.classList.toggle('on',+x.dataset.tsz===tx.z));}

  if(b.dataset.addtext!==undefined){addText();return;}
  if(b.dataset.rtab){ui.rtab=b.dataset.rtab;ui.selWall=null;renderDock();render();return;}
  if(b.dataset.addcustom!==undefined){openCustom();return;}
  if(b.dataset.tpl){
    const t=(S.tpl||[]).find(x=>x.id===b.dataset.tpl);
    if(t){
      const v=ui.view;let x=snap(v.cx),y=snap(v.cy);
      while(r.furn.some(g=>Math.abs(g.x-x)<0.1&&Math.abs(g.y-y)<0.1)){x+=0.25;y+=0.25;}
      const n=r.furn.filter(g=>g.type==='custom'&&g.name.replace(/ \d+$/,'')===t.name).length;
      const nf={id:uid(),type:'custom',e:t.e,name:n?t.name+' '+(n+1):t.name,x,y,w:t.w,d:t.d,rot:0,c:t.c,items:[],lvl:0,photos:[],note:''};
      r.furn.push(nf);save();renderInfo();select(nf.id);
    }
    return;
  }
  if(b.id==='saveTpl'&&f){
    const nm=f.name.replace(/ \d+$/,'').slice(0,40),em=emo(f)||'📦';
    S.tpl=S.tpl||[];
    if(S.tpl.some(t=>t.name===nm&&t.e===em&&Math.abs(t.w-f.w)<1e-6&&Math.abs(t.d-f.d)<1e-6)){toast('È già tra i pulsanti.');return;}
    S.tpl.push({id:uid(),name:nm,e:em,w:f.w,d:f.d,c:f.c});save();toast('Aggiunto ai pulsanti della barra dei mobili.');return;
  }
  if(b.id==='chIcon'&&f){openIconPicker(em=>{if(em) f.e=em;else delete f.e;save();render();renderDock();},!!(TYPES[f.type]&&f.e&&f.e!==TYPES[f.type].e));return;}
  if(b.dataset.add){addFurn(b.dataset.add);return;}
  if(b.id==='shClose'){select(null);return;}
  if(b.id==='shMin'){ui.shMin=!ui.shMin;renderDock();render();return;}
  if(b.dataset.lvl!==undefined&&f){f.lvl=+b.dataset.lvl;save();render();dock.querySelectorAll('[data-lvl]').forEach(x=>x.classList.toggle('on',+x.dataset.lvl===f.lvl));return;}
  if(b.dataset.c!==undefined&&f){f.c=+b.dataset.c;save();render();dock.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',+x.dataset.c===f.c));const cn=$('#cnm');if(cn) cn.textContent=cname(f.c);return;}
  if(b.dataset.delitem&&f){f.items=f.items.filter(i=>i.id!==b.dataset.delitem);if(ui.edI===b.dataset.delitem) ui.edI=null;renderItems(f);save();render();return;}
  if(b.dataset.ied&&f){ui.edI=ui.edI===b.dataset.ied?null:b.dataset.ied;renderItems(f);return;}
  if(b.dataset.ist!==undefined&&f){
    const box=b.closest('.idet'),it=box&&f.items.find(x=>x.id===box.dataset.iid);
    if(it){if(b.dataset.ist) it.st=b.dataset.ist;else delete it.st;renderItems(f);save();render();}
    return;
  }
  if(b.dataset.iow&&f){
    const box=b.closest('.idet'),it=box&&f.items.find(x=>x.id===box.dataset.iid);
    if(it){it.ow=b.dataset.iow;renderItems(f);save();render();}
    return;
  }
  if(b.dataset.itag&&f){
    const box=b.closest('.idet'),it=box&&f.items.find(x=>x.id===box.dataset.iid);
    if(it){it.tg=(it.tg||[]).concat(b.dataset.itag).slice(0,8);renderItems(f);save();render();}
    return;
  }
  if(b.dataset.iin&&f){
    const box=b.closest('.idet'),it=box&&f.items.find(x=>x.id===box.dataset.iid);
    if(it){delete it.out;renderItems(f);save();render();}
    return;
  }
  if(b.dataset.openf){select(b.dataset.openf);return;}
  if(f&&b.id==='msStart'){ui.msel=new Set();ui.edI=null;renderItems(f);return;}
  if(f&&ui.msel){
    if(b.dataset.msel){const id=b.dataset.msel;if(ui.msel.has(id)) ui.msel.delete(id);else ui.msel.add(id);renderItems(f);return;}
    if(b.id==='msAll'){f.items.forEach(i=>ui.msel.add(i.id));renderItems(f);return;}
    if(b.id==='msNone'){ui.msel.clear();renderItems(f);return;}
    if(b.id==='msDone'){ui.msel=null;renderItems(f);return;}
    if(b.id==='msDel'){twoTap(b,'Tocca ancora per eliminare',()=>{const n=ui.msel.size;f.items=f.items.filter(i=>!ui.msel.has(i.id));ui.msel=null;renderItems(f);save();render();toast(n+(n===1?' oggetto eliminato.':' oggetti eliminati.'));});return;}
  }
  if(b.id==='qrLab'&&f){qrLabelView(r,f);return;}
  if(b.id==='dup'&&f){
    const base=f.name.replace(/ \d+$/,''),n=r.furn.filter(x=>x.name.replace(/ \d+$/,'')===base).length;
    const c={id:uid(),type:f.type,name:base+' '+(n+1),x:snap(f.x+0.3),y:snap(f.y+0.3),w:f.w,d:f.d,rot:f.rot,c:f.c,items:[],lvl:0,photos:[],note:''};
    if(f.e) c.e=f.e;
    if(f.par) c.par=f.par;
    r.furn.push(c);save();renderInfo();select(c.id);toast('Copia creata, senza oggetti dentro.');return;
  }
  if(b.id==='opDone'){ui.selOp=null;render();renderDock();return;}
  if(b.id==='opDel'){r.ops=r.ops.filter(x=>x.id!==ui.selOp);ui.selOp=null;save();render();renderDock();return;}
  if(b.id==='opFlip'){const o=getOp();if(o){o.fl=((o.fl||0)+1)%4;save();render();}return;}
  if(b.id==='rpDone'){ui.rpEd=false;renderDock();return;}
  if(b.dataset.rpdel!==undefined){r.photos.splice(+b.dataset.rpdel,1);save();renderDock();return;}
  if(b.id==='bgDone'){ui.bgEd=false;renderDock();render();return;}
  if(b.id==='bgRot'){if(r.bg){r.bg.rot=((r.bg.rot||0)+90)%360;save();render();}return;}
  if(b.id==='bgDel'){twoTap(b,'Tocca ancora per togliere',()=>{delete r.bg;ui.bgEd=false;save();render();renderDock();});return;}
  if(b.dataset.iph&&f){openLight(f,0,b.dataset.iph);return;}
  if(b.dataset.ph!==undefined&&f){openLight(f,+b.dataset.ph);return;}
  if(b.id==='rot'&&f){f.rot=(Math.round(f.rot)+90)%360;const di=$('#rotDeg');if(di) di.value=f.rot;save();render();return;}
  if(b.id==='rotWall'&&f){
    const np=nearWall(r,{x:f.x,y:f.y});
    if(!np){toast('Disegna prima i muri della stanza.');return;}
    f.rot=Math.round(np.a)%360;const di=$('#rotDeg');if(di) di.value=f.rot;save();render();return;
  }
  if(b.id==='delF'&&f){twoTap(b,'Tocca ancora per eliminare',()=>{kidsOf(r,f).forEach(k=>{if(f.par) k.par=f.par;else{delete k.par;k.x=snap(f.x+0.2);k.y=snap(f.y+0.2);}});r.furn=r.furn.filter(x=>x.id!==f.id);save();renderInfo();select(null);});return;}
  if(b.dataset.zc!==undefined&&ui.zone){ui.zone.c=+b.dataset.zc;renderDock();return;}
  const a=b.dataset.act;
  if(a==='undo'){r.pts.pop();save();render();renderInfo();renderDock();}
  else if(a==='close'){closeRoom();}
  else if(a==='measures'){openMeasures();}
  else if(a==='addtext'){setMode('furn');addText();}
  else if(a==='door'){addOp('porta');}
  else if(a==='window'){addOp('finestra');}
  else if(a==='rph'){ui.rpEd=true;ui.selWall=null;ui.selOp=null;renderDock();}
  else if(a==='freestop'){ui.free=false;ui.freeLine=null;renderDock();render();}
  else if(a==='calreset'){if(ui.cal) ui.cal.pts=[];render();renderDock();}
  else if(a==='calask'){calAsk();}
  else if(a==='autotrace'){planAuto();}
  else if(a==='asok'){const L=parseNum(($('#asIn')||{}).value||'');if(!(L>=0.2&&L<=100)){toast('Scrivi la misura in metri, per esempio 9,00.');return;}ui.fin=true;calScale(L);toast('Misure calcolate. Controlla il disegno e premi Ok.');}
  else if(a==='asskip'){ui.fin=true;calScale(6);toast('Ho messo 6 metri per quel lato. Per correggere: tocca la misura di un muro e scrivi quella vera.');}
  else if(a==='finok'){ui.fin=false;save();setMode('furn');fit();toast('Piantina salvata. Ora tocca un mobile per aggiungerlo.');}
  else if(a==='finedit'){ui.fin=false;renderDock();render();}
  else if(a==='asman'){r.pts=[];r.walls=[];r.closed=false;ui.cal={pts:[]};save();fit();renderInfo();renderDock();}
  else if(a==='calrot'){if(r.bg){r.bg.rot=((r.bg.rot||0)+90)%360;save();fit();}}
  else if(a==='calskip'){ui.cal=null;renderDock();render();toast('Va bene. Ricalca i muri toccando gli angoli. La scala si può cambiare dopo, da «Foto di sfondo».');}
  else if(a==='bg'){ui.bgEd=true;ui.selWall=null;ui.selOp=null;renderDock();render();}
  else if(a==='addwall'||a==='addwalld'){ui.wallDraw={p:null,ds:a==='addwalld'};ui.selWall=null;render();renderDock();}
  else if(a==='walldash'){const w=r.walls.find(x=>x.id===ui.selWall);if(w){if(w.ds) delete w.ds;else w.ds=1;save();render();renderDock();}}
  else if(a==='zone'){ui.zone={c:0};ui.wallDraw=null;ui.selWall=null;ui.selOp=null;render();renderDock();}
  else if(a==='zoneoff'){ui.zone=null;render();renderDock();}
  else if(a==='wallstop'){ui.wallDraw=null;render();renderDock();}
  else if(a==='wallundo'){if(ui.wallDraw) ui.wallDraw.p=null;render();renderDock();}
  else if(a==='wallmeas'){editTz();}
  else if(a==='walldel'){twoTap(b,'Tocca ancora per eliminare',()=>{r.walls=r.walls.filter(x=>x.id!==ui.selWall);ui.selWall=null;save();render();renderDock();});}
  else if(a==='reset'){twoTap(b,'Tocca ancora per cancellare i muri',()=>{r.pts=[];r.walls=[];r.labels=[];r.ops=[];r.closed=false;ui.selWall=null;ui.selOp=null;ui.wallDraw=null;save();render();renderInfo();renderDock();});}
  else if(a==='renroom'){
    openModal({title:'Rinomina la stanza',ok:'Salva',fields:[{label:'Nome della stanza',value:r.name,mode:'text',max:30}],onOk:v=>{
      const n=String(v[0]).trim();
      if(!n) return 'Scrivi un nome.';
      if(S.rooms.some(x=>x!==r&&x.name.toLowerCase()===n.toLowerCase())) return 'Esiste già una stanza con questo nome.';
      r.name=n;save();renderRoomSel();renderInfo();
    }});
  }
  else if(a==='delroom'){twoTap(b,'Tocca ancora per eliminare',()=>{deleteRoom(r);});}
});
dock.addEventListener('input',e=>{
  if(e.target.id==='tText'){const tx=getT(ui.selTxt);if(tx){tx.t=e.target.value;render();saveSoon();}return;}
  if(e.target.id==='bgS'||e.target.id==='bgO'){
    const b=R().bg;
    if(b){if(e.target.id==='bgS') b.s=+e.target.value;else b.op=+e.target.value/100;render();saveSoon();}
    return;
  }
  const t=e.target,f=getF(ui.sel);if(!f) return;
  if(t.dataset&&t.dataset.if!==undefined){itemFld(t,f);return;}
  if(t.id==='fName'){f.name=t.value;render();saveSoon();}
  else if(t.id==='fNote'){f.note=t.value;saveSoon();}
});
dock.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='opW'){
    const o=getOp(),n=parseInt(t.value,10);
    if(o&&n>=30&&n<=400){o.w=n/100;save();render();}
    else if(o) t.value=Math.round(o.w*100);
    return;
  }
  if(t.id==='rpIn'||t.id==='rpCam'){
    const r=R();
    for(const file of [...t.files]){
      if(r.photos.length>=8){toast('Massimo 8 foto per stanza.');break;}
      try{r.photos.push(await shrink(file,1000));}catch(_){toast('Non riesco a leggere questa foto.');}
    }
    save();renderDock();return;
  }
  if(t.id==='bgIn'){
    const file=t.files&&t.files[0];if(!file) return;
    try{
      const img=await shrink(file,1400),im=new Image();
      await new Promise((ok,ko)=>{im.onload=ok;im.onerror=ko;im.src=img;});
      const r=R(),b0=bounds(),w0=b0?Math.max(2,b0.x1-b0.x0):5;
      r.bg={img,x:b0?(b0.x0+b0.x1)/2:ui.view.cx,y:b0?(b0.y0+b0.y1)/2:ui.view.cy,w0,s:100,ar:im.width/im.height,op:0.45,rot:0};
      save();render();renderDock();
    }catch(_){toast('Non riesco a leggere questa foto.');}
    return;
  }
  const f=getF(ui.sel);if(!f) return;
  if(t.id==='fPar'){
    const r=R();
    if(t.value) f.par=t.value;
    else if(f.par){const q=getRF(r,f.par);delete f.par;if(q){f.x=snap(q.x+0.3);f.y=snap(q.y+0.3);}}
    save();renderInfo();render();renderDock();return;
  }
  if(t.id==='addIn'){
    const k=t.value;if(!k) return;
    const r=R(),tp=TYPES[k],n=r.furn.filter(x=>x.type===k).length;
    const c={id:uid(),type:k,name:n?`${tp.label} ${n+1}`:tp.label,x:f.x,y:f.y,w:tp.w,d:tp.d,rot:0,c:tp.c,items:[],lvl:0,photos:[],note:'',par:f.id};
    r.furn.push(c);save();renderInfo();select(c.id);return;
  }
  if((t.id==='msMove'||t.id==='msSt')&&ui.msel){
    const sel=f.items.filter(i=>ui.msel.has(i.id));
    if(t.id==='msSt'){
      if(!t.value) return;
      sel.forEach(i=>{if(t.value==='-') delete i.st;else i.st=t.value;});
      ui.msel=null;renderItems(f);save();render();toast('Aggiornato.');
    }else{
      const [rid,fid]=t.value.split('|'),rr=S.rooms.find(x=>x.id===rid),tf=rr&&getRF(rr,fid);
      if(tf&&sel.length){f.items=f.items.filter(i=>!ui.msel.has(i.id));sel.forEach(i=>tf.items.push(i));ui.msel=null;renderItems(f);save();render();toast(sel.length+' spostati in «'+tf.name+'».');}
    }
    return;
  }
  if(t.dataset&&t.dataset.imv!==undefined){
    const [rid,fid]=t.value.split('|'),rr=S.rooms.find(x=>x.id===rid),tf=rr&&getRF(rr,fid),box=t.closest('.idet'),it=box&&f.items.find(x=>x.id===box.dataset.iid);
    if(tf&&it){f.items=f.items.filter(x=>x!==it);tf.items.push(it);ui.edI=null;renderItems(f);save();render();toast('Spostato in «'+tf.name+'».');}
    return;
  }
  if(t.id==='photoIn'||t.id==='photoCam'){
    const files=[...t.files];
    for(const file of files){
      if(f.photos.length>=12){toast('Massimo 12 foto per mobile.');break;}
      try{f.photos.push(await shrink(file));}catch(_){toast('Non riesco a leggere questa foto.');}
    }
    renderPhotos(f);save();
  }else if(t.dataset&&t.dataset.iphin!==undefined){
    const file=t.files&&t.files[0];if(!file) return;
    try{
      const p=await shrink(file,640),it=f.items.find(x=>x.id===t.dataset.iphin);
      if(it){it.p=p;renderItems(f);save();}
    }catch(_){toast('Non riesco a leggere questa foto.');}
  }else if(t.id==='itemPhoto'){
    const file=t.files&&t.files[0];if(!file) return;
    try{pend=await shrink(file,640);renderPend();}
    catch(_){toast('Non riesco a leggere questa foto.');}
  }else if(t.id==='rotDeg'){
    const n=parseFloat(String(t.value).replace(',','.'));
    if(isFinite(n)){f.rot=((Math.round(n)%360)+360)%360;t.value=f.rot;save();render();}

function fillDemo(){
  forceSnap();
  const keys=Object.keys(TYPES).filter(k=>k!=='custom'&&TYPES[k].w);
  const pool=['Coperte di lana','Decorazioni di Natale','Libri vecchi','Trapano','Vestiti invernali','Scarpe da ginnastica','Giochi dei bambini','Cavi e caricabatterie','Lenzuola','Album di foto','Valigia piccola','Lampada','Cornici','Piatti di scorta','Attrezzi da giardino','Sci e racchette','Tende','Documenti vecchi','Vasi','Bici da bambino'];
  const sts=['buttare','regalare','vendere'];
  const rnd=n=>Math.floor(Math.random()*n);
  const inPoly=(P,x,y)=>{let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){if((P[i].y>y)!==(P[j].y>y)&&x<(P[j].x-P[i].x)*(y-P[i].y)/(P[j].y-P[i].y)+P[i].x) c=!c;}return c;};
  let tot=0;
  S.rooms.forEach(r=>{
    if(!r.closed||r.pts.length<3) return;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    r.pts.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);});
    const target=6+rnd(4);let got=0,tries=0;
    while(got<target&&tries<600){
      tries++;
      const type=keys[rnd(keys.length)],t=TYPES[type],rot=Math.random()<0.3?90:0;
      const hw=(rot?t.d:t.w)/2+0.06,hh=(rot?t.w:t.d)/2+0.06;
      const x=snap(x0+0.2+Math.random()*(x1-x0-0.4)),y=snap(y0+0.2+Math.random()*(y1-y0-0.4));
      if(![[x-hw,y-hh],[x+hw,y-hh],[x-hw,y+hh],[x+hw,y+hh],[x,y]].every(c=>inPoly(r.pts,c[0],c[1]))) continue;
      if(r.furn.some(f=>{if(f.par) return false;const e=ext(f);return Math.abs(f.x-x)<e.hw+hw&&Math.abs(f.y-y)<e.hh+hh;})) continue;
      const n=r.furn.filter(f=>f.type===type).length;
      const items=[];const k=rnd(6);
      for(let i=0;i<k;i++){const it={id:uid(),t:pool[rnd(pool.length)]};if(Math.random()<0.3) it.q=2+rnd(4);if(Math.random()<0.2) it.st=sts[rnd(3)];items.push(it);}
      r.furn.push({id:uid(),type,name:n?`${t.label} ${n+1}`:t.label,x,y,w:t.w,d:t.d,rot,c:t.c,items,lvl:rnd(5),photos:[],note:''});
      got++;tot++;
    }
  });
  save();renderInfo();render();renderDock();
  toast(tot?`Ho aggiunto ${tot} mobili d’esempio.`:'Non ho trovato stanze disegnate dove metterli.');
}

const PH_NUM={un:1,uno:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,undici:11,dodici:12,tredici:13,quattordici:14,quindici:15,venti:20,venticinque:25,trenta:30,cinquanta:50,cento:100};
const PH_NW='(?:'+Object.keys(PH_NUM).sort((a,b)=>b.length-a.length).join('|')+')';
const phNorm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const phStem=w=>w.replace(/[aeiou]+$/,'')||w;
const PH_STOP=new Set(['di','da','del','della','dei','delle','con','per','the','il','lo','la','le','gli','i']);
const phCap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const PH_ART=/^(?:il|lo|la|l['’]|i|gli|le|dei|degli|delle|del|della|dello|dell['’]|alcuni|alcune|qualche|diversi|diverse|molti|molte|tanti|tante|altri|altre)(?:\s+|(?<=['’]))/iu;
const PH_VERB=/^[\s,:\-–]*(?:per favore\s+|per piacere\s+|ora\s+)?(?:(?:inserisci|inserire|inserisco|metti|mettici|mettere|metto|aggiungi|aggiungere|aggiungo|riponi|riporre|ripongo|ho messo|ho riposto|ho aggiunto|tieni|conserva|c['’]è|c['’]e|ci sono|ci sta|ci stanno|ci va|ci vanno|contiene|dentro|ci)\b)+[\s,:\-–]*/iu;
function phItem(seg){
  let s=seg.trim().replace(/[.!?]+$/,'').trim();
  if(!s) return null;
  s=s.replace(PH_ART,'').replace(PH_ART,'');
  let q=0,m;
  const unit=u=>({paio:'Paio',paia:'Paia',coppia:'Coppia',coppie:'Coppie'})[u.toLowerCase()];
  if((m=s.match(/^(\d+)\s*x\s*(.+)$/iu))){q=+m[1];s=m[2];}
  else if((m=s.match(new RegExp('^(\\d+|'+PH_NW+')\\s+(paio|paia|coppia|coppie)\\s+d[ie][\\s\'’]*(.+)$','iu')))){
    const n=/^\d+$/.test(m[1])?+m[1]:PH_NUM[m[1].toLowerCase()];
    const u=unit(m[2]);s=(n===1?u.replace('Paia','Paio').replace('Coppie','Coppia'):u.replace('Paio','Paia').replace('Coppia','Coppie'))+' di '+m[3];if(n>1) q=n;
  }
  else if((m=s.match(/^(paio|paia|coppia|coppie)\s+d[ie]\s+(.+)$/iu))){s=unit(m[1])+' di '+m[2];}
  else if((m=s.match(/^(\d+)\s+(.+)$/u))){q=+m[1];s=m[2];}
  else if((m=s.match(new RegExp('^('+PH_NW+')\\s+(.+)$','iu')))){q=PH_NUM[m[1].toLowerCase()];s=m[2];}
  s=s.replace(PH_ART,'').trim();
  if(s.length<2) return null;
  const it={t:phCap(s).slice(0,60)};
  if(q>1) it.q=Math.min(q,9999);

function planAutoApply(tr){
  const r=R(),bg=r.bg;if(!bg||!tr) return false;
  const bw=bg.w0*bg.s/100,bh=bw/bg.ar,a=(bg.rot||0)*Math.PI/180,co=Math.cos(a),si=Math.sin(a);

  r.pts=tr.poly.map(W2);r.closed=true;
  r.walls=tr.walls.map(q=>({id:uid(),a:W2(q.a),b:W2(q.b)}));
  r.ops=(tr.ops||[]).map(q=>{const p=W2(q);return {id:uid(),k:q.k,x:p.x,y:p.y,a:rnd((((q.o==='V'?90:0)+(bg.rot||0))%180+180)%180),w:rnd(q.l*bw),fl:q.fl||0};});
  r.zones=[];
  return true;
}
async function planAuto(quiet){
  const r=R();if(!r.bg||!r.bg.img) return false;
  toast('Sto leggendo la piantina…');
  await new Promise(ok=>setTimeout(ok,50));
  let tr=null;
  try{tr=await planTrace(r.bg.img);}catch(_){}
  if(!tr){if(!quiet) toast('Non sono riuscito a riconoscere i muri in questa foto. Prova a ricalcarli toccando gli angoli.');return false;}
  forceSnap();
  planAutoApply(tr);
  /* scala: il lato più lungo del perimetro */
  let bi=0,bl=0;for(let i=0;i<r.pts.length;i++){const p=r.pts[i],q=r.pts[(i+1)%r.pts.length],l=Math.hypot(q.x-p.x,q.y-p.y);if(l>bl){bl=l;bi=i;}}
  const p=r.pts[bi],q=r.pts[(bi+1)%r.pts.length];
  ui.cal={pts:[{x:p.x,y:p.y},{x:q.x,y:q.y}],auto:true};
  setMode('room');ui.cal={pts:[{x:p.x,y:p.y},{x:q.x,y:q.y}],auto:true};
  save();fit();renderInfo();renderDock();
  toast(tr.walls.length?`Fatto: ho disegnato il perimetro, ${tr.walls.length} muri interni e ${(tr.ops||[]).length} porte e finestre.`:'Fatto: ho disegnato il perimetro.');
  return true;
}
function calScale(L){
  const c=ui.cal,r=R(),bg=r.bg;if(!c||c.pts.length<2||!bg) return;
  const a=c.pts[0],b=c.pts[1],dcur=Math.hypot(b.x-a.x,b.y-a.y)||1,k=L/dcur,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  bg.w0*=k;bg.x=mx+(bg.x-mx)*k;bg.y=my+(bg.y-my)*k;
  const sc=q=>{q.x=rnd(mx+(q.x-mx)*k);q.y=rnd(my+(q.y-my)*k);};
  r.pts.forEach(sc);r.walls.forEach(w=>{sc(w.a);sc(w.b);});r.ops.forEach(o=>{sc(o);o.w=Math.max(0.5,rnd(o.w*k));});
  ui.cal=null;save();fit();renderInfo();renderDock();
}

function csvParse(text){
  text=String(text||'').replace(/^﻿/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const cnt=c=>(first.match(new RegExp(c==='\t'?'\t':'\\'+c,'g'))||[]).length;
  const d=[[';',cnt(';')],['\t',cnt('\t')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"'&&!cur) q=true;
    else if(c===d){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n') i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(a=>a.some(x=>String(x).trim()));
}
function csvTypeFor(tipo,name){
  const ks=Object.keys(TYPES).filter(k=>k!=='custom'&&TYPES[k].w).sort((a,b)=>TYPES[b].label.length-TYPES[a].label.length);
  const t=csvN(tipo);
  if(t){const k=ks.find(k=>csvN(TYPES[k].label)===t||k===t);if(k) return k;}
  const n=csvN(name);
  const k=ks.find(k=>n===csvN(TYPES[k].label)||n.indexOf(csvN(TYPES[k].label)+' ')===0||n.indexOf(' '+csvN(TYPES[k].label))>=0);
  return k||'scatola';
}
function csvPlan(text,r){

    let F=by[key];
    if(!F){F=by[key]={name:fname.slice(0,40),tipo:g('tipo'),par:g('par'),note:g('note'),items:[]};order.push(key);}
    else{if(!F.tipo) F.tipo=g('tipo');if(!F.par) F.par=g('par');if(!F.note) F.note=g('note');}
    if(!itm) return;
    const it={t:itm.slice(0,60)};
    const qv=g('q');if(qv){const n=parseInt(qv,10);if(n>=1&&n<10000) it.q=n;else P.warn.push('Riga '+ln+': quantità «'+qv+'» non valida, la ignoro.');}
    const sv=g('st');if(sv){const k=stMap[csvN(sv)];if(k) it.st=k;else P.warn.push('Riga '+ln+': stato «'+sv+'» non riconosciuto (usa Tieni, Da buttare, Da regalare, Da vendere).');}
    const ov=g('ow');if(ov) it.ow=ov.slice(0,30);

}
function csvFreeSpot(r,hw,hh){
  const inP=(P,x,y)=>{let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){if((P[i].y>y)!==(P[j].y>y)&&x<(P[j].x-P[i].x)*(y-P[i].y)/(P[j].y-P[i].y)+P[i].x) c=!c;}return c;};
  const poly=r.closed&&r.pts.length>=3;
  const ok=(x,y)=>(!poly||[[x-hw,y-hh],[x+hw,y-hh],[x-hw,y+hh],[x+hw,y+hh]].every(c=>inP(r.pts,c[0],c[1])))&&!r.furn.some(f=>{if(f.par) return false;const e=ext(f);return Math.abs(f.x-x)<e.hw+hw&&Math.abs(f.y-y)<e.hh+hh;});
  let x0=0,y0=0,x1=8,y1=8;
  if(r.pts.length>=3){x0=1e9;y0=1e9;x1=-1e9;y1=-1e9;r.pts.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);});}
  for(let y=y0+hh+0.1;y<=y1;y+=0.25) for(let x=x0+hw+0.1;x<=x1;x+=0.25){const sx=snap(x),sy=snap(y);if(ok(sx,sy)) return {x:sx,y:sy};}
  return {x:snap((x0+x1)/2),y:snap((y0+y1)/2)};
}
function csvApply(P,r,mode){
  forceSnap();
  const made=[];
  P.furn.forEach(F=>{
    let f=F.ex;
    if(!f){
      const type=csvTypeFor(F.tipo,F.name),t=TYPES[type],sp=csvFreeSpot(r,t.w/2+0.06,t.d/2+0.06);
      f={id:uid(),type,name:F.name,x:sp.x,y:sp.y,w:t.w,d:t.d,rot:0,c:t.c,items:[],lvl:0,photos:[],note:''};
      r.furn.push(f);made.push(f.id);F.made=f;
    }
    if(F.note) f.note=F.note.slice(0,200);
    if(F.ex&&mode==='replace') f.items=[];
    F.items.forEach(it=>{
      const old=f.items.find(x=>csvN(x.t)===csvN(it.t));
      if(old){if(it.q) old.q=it.q;if(it.st) old.st=it.st;if(it.ow) old.ow=it.ow;}
      else{const n={id:uid(),t:it.t};if(it.q>1) n.q=it.q;if(it.st) n.st=it.st;if(it.ow) n.ow=it.ow;f.items.push(n);}
    });
  });
  P.furn.forEach(F=>{
    const f=F.ex||F.made;if(!f||!F.par) return;
    const p=r.furn.find(x=>csvN(x.name)===csvN(F.par)&&x.id!==f.id);
    if(p&&!f.par){let a=p,loop=false;while(a){if(a.id===f.id){loop=true;break;}a=a.par&&r.furn.find(x=>x.id===a.par);}if(!loop){f.par=p.id;f.x=p.x;f.y=p.y;}}
  });
  save();renderInfo();render();renderDock();
  return made;
}

    Object.keys(sy.rooms).forEach(id=>{if(!rem[id]&&!lmap[id]) delete sy.rooms[id];});

        for(const id of pulls){const r=await syPullRoom(id,known);if(r) got.push({id,r,e:rem[id]});}
      }

    const upPh=new Set(sy.ph);
    for(const id of pushes){
      const o=lmap[id];if(!o) continue;
      for(const pid in o.ph){
        if(upPh.has(pid)) continue;
        const d=o.ph[pid];
        if(d.length>1000000){continue;}
        await syFs('PATCH','photos/'+pid,{fields:{d:{stringValue:d}}});
        upPh.add(pid);sy.ph.push(pid);
      }
      const t=Date.now();
      await syFs('PATCH','rooms/'+id,{fields:{j:{stringValue:o.j},t:{integerValue:String(t)}}});
      await syFs('PATCH','meta/idx',{fields:{['r_'+id]:syEnc(t,o.h)}},'updateMask.fieldPaths=r_'+id);
      sy.rooms[id]={h:o.h,t};
    }
    for(const id of dels){

        const d=await syFs('GET','meta/shared');

      }
    }
    /* applica a questo telefono */
    if(got.length||drop.length){
      syApplying=true;
      got.forEach(({id,r,e})=>{
        const nr=norm({rooms:[r],tpl:[],pref:{}});if(!nr) return;
        const room=nr.rooms[0],i=S.rooms.findIndex(x=>x.id===id);

  }
}

/* triangolazione del pavimento (poligono anche a L) */
