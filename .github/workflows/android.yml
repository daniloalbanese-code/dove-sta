name: Crea app Android
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Controllo chiave di firma
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "Manca il segreto KEYSTORE_BASE64"; exit 1; fi
      - name: Prepara i file del sito
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - name: Icone
        run: npx capacitor-assets generate --android
      - name: Numero versione
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Costruisci
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Firma
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS" | base64 -d > ks.jks
          cp android/app/build/outputs/bundle/release/app-release.aab dove-sta.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore ks.jks -storepass "$KS_PASS" dove-sta.aab "$KS_ALIAS"
          jarsigner -verify dove-sta.aab | head -3
          rm ks.jks
      - uses: actions/upload-artifact@v4
        with:
          name: dove-sta-aab
          path: dove-sta.aab
