name: Crea app Android
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Controllo password
        env:
          KP: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$KP" ]; then echo "Manca il segreto KEY_PASS"; exit 1; fi
      - name: Prepara i file del sito
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - name: Schermo con fotocamera e barre
        run: |
          cat > android/app/src/main/java/it/dovesta/app/MainActivity.java <<'EOF'
          package it.dovesta.app;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
            private static final int SAVE_REQ = 4711;
            private WebView wv;
            private String pendingB64;

            public class Ponte {
              @JavascriptInterface
              public void print() {
                runOnUiThread(() -> {
                  PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                  PrintDocumentAdapter ad = wv.createPrintDocumentAdapter("Dove Sta");
                  pm.print("Dove Sta", ad, new PrintAttributes.Builder().build());
                });
              }

              @JavascriptInterface
              public void save(final String name, final String mime, String b64) {
                pendingB64 = b64;
                runOnUiThread(() -> {
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(mime);
                  i.putExtra(Intent.EXTRA_TITLE, name);
                  startActivityForResult(i, SAVE_REQ);
                });
              }
            }

            private void tell(int code) {
              final String js = "window.__saved&&window.__saved(" + code + ")";
              runOnUiThread(() -> wv.evaluateJavascript(js, null));
            }

            @Override
            public void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode != SAVE_REQ) return;
              if (resultCode == RESULT_OK && data != null && data.getData() != null && pendingB64 != null) {
                try (OutputStream os = getContentResolver().openOutputStream(data.getData())) {
                  os.write(Base64.decode(pendingB64, Base64.DEFAULT));
                  tell(1);
                } catch (Exception e) {
                  tell(-1);
                }
              } else {
                tell(0);
              }
              pendingB64 = null;
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              wv = getBridge().getWebView();
              Ponte p = new Ponte();
              wv.addJavascriptInterface(p, "AndroidPrint");
              wv.addJavascriptInterface(p, "AndroidSave");
              View v = findViewById(android.R.id.content);
              v.setBackgroundColor(0xFFF6F8F8);
              WindowCompat.getInsetsController(getWindow(), v).setAppearanceLightStatusBars(true);
              WindowCompat.getInsetsController(getWindow(), v).setAppearanceLightNavigationBars(true);
              ViewCompat.setOnApplyWindowInsetsListener(v, (view, insets) -> {
                Insets b = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                view.setPadding(b.left, b.top, b.right, b.bottom);
                return WindowInsetsCompat.CONSUMED;
              });
            }
          }
          EOF
          ls android/app/src/main/java/it/dovesta/app/
      - name: Icone
        run: npx capacitor-assets generate --android
      - name: Numero versione
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Costruisci
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Firma
        env:
          KP: ${{ secrets.KEY_PASS }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KP -in assets/ks.enc -out ks.jks
          cp android/app/build/outputs/bundle/release/app-release.aab dove-sta.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore ks.jks -storepass "$KP" dove-sta.aab dovesta
          jarsigner -verify dove-sta.aab | head -3
          rm ks.jks
      - uses: actions/upload-artifact@v4
        with:
          name: dove-sta-aab
          path: dove-sta.aab
